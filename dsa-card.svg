<svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DSA and problem solving snapshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.12" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="320" rx="28" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="917" height="317" rx="26" fill="none" stroke="url(#accent)" stroke-opacity="0.35" />

  <circle cx="120" cy="70" r="120" fill="#38BDF8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="820" cy="250" r="140" fill="#22C55E" fill-opacity="0.08" filter="url(#glow)" />
  <path d="M52 244 C 160 176, 258 236, 350 170 S 562 130, 672 196 S 806 240, 868 176" fill="none" stroke="url(#accent)" stroke-opacity="0.12" stroke-width="2.2" />

  <rect x="28" y="24" width="864" height="272" rx="22" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04" />

  <rect x="48" y="48" width="162" height="34" rx="17" fill="url(#accentSoft)" />
  <text x="64" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#BAE6FD">DSA SNAPSHOT</text>

  <text x="48" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Problem solving.</text>
  <text x="48" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">Codolio and LeetCode progress, aligned to the current profile numbers.</text>

  <text x="48" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#accent)" filter="url(#glow)">425</text>
  <text x="50" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#CBD5E1">QUESTIONS SOLVED</text>

  <rect x="48" y="256" width="202" height="28" rx="14" fill="white" fill-opacity="0.05" />
  <text x="62" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#E2E8F0">425+ solved across DSA and problem solving</text>

